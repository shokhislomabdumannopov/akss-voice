<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Main Emblem Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Emerald / Voice Wave Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle / Badge -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGlow)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" opacity="0.85"/>

  <!-- Khwarizmi Algorithmic Geometric Octagon Nodes -->
  <g opacity="0.35">
    <polygon points="256,66 390,122 446,256 390,390 256,446 122,390 66,256 122,122" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>
    <circle cx="256" cy="66" r="4" fill="#38bdf8"/>
    <circle cx="446" cy="256" r="4" fill="#38bdf8"/>
    <circle cx="256" cy="446" r="4" fill="#10b981"/>
    <circle cx="66" cy="256" r="4" fill="#10b981"/>
  </g>

  <!-- Central Shield / Badge Base -->
  <g filter="url(#dropShadow)">
    <path d="M 256,110 
             L 375,155 
             L 375,270 
             C 375,345 256,395 256,395 
             C 256,395 137,345 137,270 
             L 137,155 Z" 
          fill="rgba(15, 23, 42, 0.95)" 
          stroke="url(#ringGrad)" 
          stroke-width="3.5"/>
  </g>

  <!-- Stylized Megaphone + Digital Voice Waves Icon -->
  <g filter="url(#softGlow)" transform="translate(0, -6)">
    <!-- Voice Sound Waves (Right side) -->
    <path d="M 305,200 C 325,215 338,236 338,260 C 338,284 325,305 305,320" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 328,175 C 358,198 376,227 376,260 C 376,293 358,322 328,345" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

    <!-- Central Dynamic Bullhorn / Speaker -->
    <!-- Handle -->
    <path d="M 205,275 L 205,335 C 205,342 198,348 190,348 L 180,348 C 172,348 165,342 165,335 L 165,275 Z" fill="#1e293b" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
    
    <!-- Body -->
    <path d="M 180,210 
             L 245,210 
             L 295,170 
             C 302,165 308,169 308,178 
             L 308,342 
             C 308,351 302,355 295,350 
             L 245,310 
             L 180,310 
             C 172,310 165,303 165,295 
             L 165,225 
             C 165,217 172,210 180,210 Z" 
          fill="url(#primaryGrad)" 
          stroke="rgba(255, 255, 255, 0.3)" 
          stroke-width="2.5"/>

    <!-- Speaker Core Detail (Gold Star / Crest of Excellence) -->
    <circle cx="212" cy="260" r="14" fill="rgba(15, 23, 42, 0.8)" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <polygon points="212,250 215,257 222,257 217,262 219,269 212,265 205,269 207,262 202,257 209,257" fill="url(#goldGrad)"/>

    <!-- Soundwave bars inside cone -->
    <line x1="262" y1="225" x2="262" y2="295" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="282" y1="205" x2="282" y2="315" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: AKSS VOICE -->
  <text x="256" y="428" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle">
    AKSS <tspan fill="#38bdf8">VOICE</tspan>
  </text>

  <!-- Subtitle: STUDENT COUNCIL -->
  <text x="256" y="450" 
        font-family="'JetBrains Mono', monospace" 
        font-size="11.5" 
        font-weight="700" 
        letter-spacing="6" 
        fill="#10b981" 
        text-anchor="middle" 
        opacity="0.95">
    STUDENT COUNCIL
  </text>
</svg>
